# Automatic failover: append DOMAIN/DOMAIN-SUFFIX rules targeting MOBILE.
# No domains are selected and no subscription or remote rule list is required.
mode: rule
log-level: info
ipv6: true
proxies:
  - name: MOBILE-USB
    type: direct
    routing-mark: 106
    ip-version: ipv4
# Ordered fallback checks both exits even while idle, so recovery is automatic.
proxy-groups:
  - name: MOBILE
    type: fallback
    proxies:
      - MOBILE-USB
      - DIRECT
    url: https://cp.cloudflare.com/generate_204
    expected-status: 204
    interval: 10
    timeout: 3000
    max-failed-times: 1
    lazy: false
rules:
  - MATCH,DIRECT
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # Shared DNS follows the wired main table; application connections selected
  # for MOBILE use table 106. This profile does not promise DNS isolation.
  nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
