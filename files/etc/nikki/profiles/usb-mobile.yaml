# Local profile: add DOMAIN/DOMAIN-SUFFIX -> MOBILE in Nikki's appended rules.
# No domains are selected and no subscription or remote rule list is required.
mode: rule
log-level: info
ipv6: true
proxies:
  - name: MOBILE
    type: direct
    routing-mark: 106
    ip-version: ipv4
rules:
  - MATCH,DIRECT
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # Shared DNS follows the wired main table; application connections selected
  # for MOBILE use table 106. This profile does not promise DNS isolation.
  nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
