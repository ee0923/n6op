name: Build ImmortalWrt for Netcore N60 Pro

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Only used with update_sources: ImmortalWrt branch, tag or commit'
        required: true
        default: openwrt-25.12
        type: string
      update_sources:
        description: 'Refresh upstream and all feeds for this run; default uses committed source lock'
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'configs/**'
      - 'scripts/**'
      - 'files/**'
      - 'patches/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: n60-pro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CCACHE_MAXSIZE: 2G
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare disk and dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget curl \
            ca-certificates ccache cmake ninja-build libelf-dev device-tree-compiler openssh-server nodejs \
            subversion quilt patch xsltproc libxml-parser-perl time zstd
          df -h
          mkdir -p logs artifacts
          sudo mkdir -p /run/sshd

      - name: Check build scripts
        run: |
          test -x /usr/sbin/sshd
          python3 -m unittest discover -s tests
          node tests/test_mobile_ui.js
          bash -n scripts/check-device.sh
          sh -n files/etc/uci-defaults/99-custom-lan
          sh -n files/etc/uci-defaults/30_luci-theme-argon
          sh -n files/etc/uci-defaults/90-mobile-usb
          sh -n files/etc/udhcpc.user.d/70-mobile-usb
          sh -n files/etc/hotplug.d/iface/70-mobile-usb

      - name: Resolve locked sources
        id: sources
        env:
          UPDATE_SOURCES: ${{ inputs.update_sources && 'true' || 'false' }}
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'openwrt-25.12' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$UPDATE_SOURCES" = 'true' ]; then
            python3 scripts/source-lock.py update --upstream-ref "$UPSTREAM_REF"
          fi
          python3 scripts/source-lock.py outputs >> "$GITHUB_OUTPUT"

      - name: Checkout official ImmortalWrt
        id: upstream
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: ${{ steps.sources.outputs.upstream_commit }}
          path: source
          persist-credentials: false

      - name: Update feeds and configure device
        run: |
          set -euo pipefail
          cd source
          python3 ../scripts/source-lock.py feeds > feeds.conf
          ./scripts/feeds update -a 2>&1 | tee ../logs/feeds-update.log
          python3 ../scripts/source-lock.py verify --source-dir .
          python3 ../scripts/privacy-patch.py apply --source-dir . --report ../artifacts/privacy-patches.json
          ./scripts/feeds update -i luci nikki 2>&1 | tee ../logs/feeds-privacy-index.log
          ./scripts/feeds install -a 2>&1 | tee ../logs/feeds-install.log
          ./scripts/feeds install -f -p nikki nikki luci-app-nikki mihomo-meta \
            2>&1 | tee ../logs/feeds-nikki.log
          mkdir -p files
          cp -a ../files/. files/
          chmod +x files/etc/uci-defaults/99-custom-lan files/etc/uci-defaults/30_luci-theme-argon
          cp ../configs/netcore-n60-pro.config .config
          make defconfig 2>&1 | tee ../logs/defconfig.log
          bash ../scripts/check-device.sh .
          cp .config ../artifacts/build.config
          cp ../configs/source-lock.json ../artifacts/source-lock.json
          ./scripts/diffconfig.sh > ../artifacts/diffconfig
          python3 ../scripts/collect-build-info.py --source-dir . --output ../artifacts/build-info.txt

      - name: Cache downloaded sources
        uses: actions/cache@v4
        with:
          path: source/dl
          key: ${{ runner.os }}-n60-dl-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-n60-dl-v1-

      - name: Cache compiler results
        uses: actions/cache@v4
        with:
          path: source/.ccache
          key: ${{ runner.os }}-n60-ccache-v1-${{ hashFiles('configs/netcore-n60-pro.config') }}-${{ steps.upstream.outputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-n60-ccache-v1-${{ hashFiles('configs/netcore-n60-pro.config') }}-${{ steps.upstream.outputs.commit }}-
            ${{ runner.os }}-n60-ccache-v1-${{ hashFiles('configs/netcore-n60-pro.config') }}-

      - name: Download sources
        run: |
          set -euo pipefail
          cd source
          make download -j8 2>&1 | tee ../logs/download.log

      - name: Compile firmware
        run: |
          set -euo pipefail
          cd source
          make -j"$(nproc)" 2>&1 | tee ../logs/build.log || \
            make -j1 V=s 2>&1 | tee ../logs/build-retry.log

      - name: Collect firmware and checksums
        run: |
          set -euo pipefail
          target=source/bin/targets/mediatek/filogic
          python3 scripts/privacy-patch.py verify-built --source-dir source --report artifacts/privacy-built.json
          python3 scripts/check-firmware.py "$target"
          cp -a "$target"/. artifacts/
          cd artifacts
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | \
            sort -z | xargs -0 sha256sum > SHA256SUMS
          {
            printf '### Netcore N60 Pro 编译完成\n\n'
            printf '官方设备配置：`netcore_n60-pro`，平台：`mediatek/filogic`。\n\n'
            printf '默认 LAN：`192.168.6.1/24`；内置 Nikki、中文 Argon 主题、Mihomo Meta 和默认 OpenSSH（22 端口）。\n\n'
            printf '发布步骤完成后可从 Releases 下载固件，也可从本次运行的 Artifacts 下载。\n'
            printf '首次从原厂固件安装需核对引导程序和分区布局；sysupgrade.itb 用于兼容布局的升级。\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-netcore-n60-pro-${{ github.run_number }}
          path: artifacts/
          overwrite: true
          if-no-files-found: error
          retention-days: 14

      - name: Collect source diagnostics
        if: always()
        run: |
          python3 scripts/collect-build-info.py --source-dir source --output logs/build-info.txt

      - name: Upload build logs and resolved configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n60-pro-build-logs-${{ github.run_number }}
          overwrite: true
          path: |
            logs/
            source/.config
            source/feeds.conf
            configs/source-lock.json
            configs/netcore-n60-pro.config
            artifacts/build-info.txt
            artifacts/privacy-*.json
            patches/privacy/series.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  release:
    name: Publish firmware to GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: immortalwrt-netcore-n60-pro-${{ github.run_number }}
          path: artifacts

      - name: Prepare release assets and notes
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum -c SHA256SUMS
          cd ..
          mkdir -p release-assets
          # GitHub asset names must not differ only by letter case.
          # Upstream sha256sums and our SHA256SUMS would otherwise collide.
          find artifacts -maxdepth 1 -type f ! -iname sha256sums \
            ! -iname release-checksums.txt \
            -exec cp -- {} release-assets/ \;
          tar -czf release-assets/immortalwrt-netcore-n60-pro.tar.gz -C artifacts .
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name release-checksums.txt -print0 | \
              sort -z | xargs -0 sha256sum > release-checksums.txt
          )
          cat > release-notes.md <<'EOF'
          Netcore N60 Pro 的 ImmortalWrt 自动编译固件。

          - 平台：`mediatek/filogic`，官方设备配置：`netcore_n60-pro`。
          - 内置 Nikki、中文 LuCI、Argon 默认主题、HTTPS 和 Mihomo Meta 稳定内核。
          - 默认 SSH：OpenSSH（TCP 22），内置 SFTP，不含 Dropbear；先通过 LuCI 设置 root 密码或配置公钥。
          - 全新安装默认 LAN：`192.168.6.1/24`，DHCP：`192.168.6.100–249`。
          - Nikki 需自行配置订阅或配置文件并启用。
          - `*sysupgrade.itb` 用于引导与分区布局兼容的 OpenWrt/ImmortalWrt 升级。
          - 首次从原厂安装须先核对引导程序及分区布局；引导文件不是普通升级固件。
          - `.tar.gz` 包含完整构建产物，单独附件可直接下载；`release-checksums.txt` 校验本 Release 的附件。
          - 自动编译成功不代表已经通过实机测试。

          构建记录：
          ```text
          EOF
          cat artifacts/build-info.txt >> release-notes.md
          printf '\n```\n' >> release-notes.md

      - name: Create and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: n60-pro-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_TITLE: Netcore N60 Pro - Build ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          names = {}
          for asset in Path('release-assets').iterdir():
              key = asset.name.casefold()
              if key in names:
                  raise SystemExit(f'Duplicate release asset names: {names[key]} and {asset.name}')
              names[key] = asset.name
          PY
          assets=(release-assets/*)
          if ! gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$RELEASE_REPO" \
              --target "$RELEASE_COMMIT" \
              --title "$RELEASE_TITLE" \
              --notes-file release-notes.md \
              --draft
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$RELEASE_REPO" --clobber
          gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPO" --draft=false --latest
          release_url=$(gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" --json url --jq .url)
          printf '### Release 已发布\n\n[下载固件](%s)\n' "$release_url" >> "$GITHUB_STEP_SUMMARY"
